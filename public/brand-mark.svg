<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="kpOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="kpNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="120" fill="#0F172A"/>

  <!-- Location Pin Outer Shape -->
  <path d="M 256,432 C 220,380 144,296 144,204 C 144,142 194,92 256,92 C 318,92 368,142 368,204 C 368,296 292,380 256,432 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="32" stroke-linejoin="round"/>

  <!-- Geometric 'K' Monogram inside the Pin -->
  <!-- Vertical Stem -->
  <rect x="206" y="148" width="28" height="112" rx="7" fill="#FFFFFF"/>
  <!-- Upper Diagonal -->
  <path d="M 230,206 L 288,148 C 294,142 304,145 304,153 L 304,162 C 304,168 300,174 294,178 L 254,216 Z" fill="#FFFFFF"/>
  <!-- Lower Diagonal (Accent Orange) -->
  <path d="M 240,204 L 298,252 C 304,257 306,265 302,272 L 296,280 C 290,286 281,285 276,280 L 224,228 Z" fill="url(#kpOrange)"/>

  <!-- Top Verified Shield Accent -->
  <g transform="translate(256, 92)">
    <path d="M 0,-34 L 28,-20 C 28,10 16,32 0,44 C -16,32 -28,10 -28,-20 Z" fill="url(#kpOrange)"/>
    <!-- Checkmark inside Shield -->
    <path d="M -9,-6 L -2,1 L 9,-12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
